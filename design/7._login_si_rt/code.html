<!DOCTYPE html><html lang="id" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Masuk - SiRT Portal Warga</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              500: '#6366f1',
              600: '#5842ed',
              700: '#4f39e3',
              800: '#3f28cf',
              900: '#2d1b82',
            }
          },
          boxShadow: {
            'floating': '0 20px 45px -12px rgba(99, 102, 241, 0.12), 0 8px 24px -8px rgba(0, 0, 0, 0.06)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles for Decorative Elements -->
<style data-purpose="decorations">
    /* Subtle dot grid pattern */
    .bg-dot-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.3) 1.5px, transparent 1.5px);
      background-size: 16px 16px;
    }
    
    /* Smooth gradient background matching reference */
    .hero-gradient {
      background: linear-gradient(145deg, #6c47ff 0%, #583be8 45%, #4622cf 100%);
    }

    /* Soft curved organic shape decoration */
    .organic-shape-1 {
      position: absolute;
      width: 480px;
      height: 480px;
      left: -160px;
      bottom: -120px;
      border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
      background: radial-gradient(circle, rgba(142, 98, 255, 0.35) 0%, rgba(93, 56, 240, 0.05) 70%, transparent 100%);
      filter: blur(28px);
      pointer-events: none;
    }
  </style>
<!-- END: Custom Styles for Decorative Elements -->
</head>
<body class="font-sans antialiased min-h-screen text-slate-800 flex flex-col justify-center bg-[#fefae6]">
<!-- BEGIN: MainContainer -->
<main class="w-full min-h-screen flex flex-col lg:flex-row" data-purpose="auth-split-layout">
<!-- BEGIN: LeftBrandShowcase -->
<section class="lg:w-1/2 hero-gradient relative overflow-hidden flex flex-col justify-between p-8 sm:p-12 lg:p-16 text-white min-h-[460px] lg:min-h-screen" style="background: linear-gradient(145deg, rgb(109, 8, 8) 0%, rgb(72, 0, 2) 55%, rgb(45, 0, 0) 100%);">
<!-- Dot grid decorative accent in top-left corner -->
<div aria-hidden="true" class="absolute top-8 left-8 w-28 h-28 bg-dot-pattern opacity-60 pointer-events-none"></div>
<!-- Organic glow shape at bottom-left -->
<div aria-hidden="true" class="organic-shape-1"></div>
<!-- Top placeholder space to maintain vertical balance -->
<div class="relative z-10 flex items-center gap-2"><span class="inline-block w-2.5 h-2.5 rounded-full bg-[#ffb4aa]"></span>
<span class="text-xs font-semibold tracking-wider uppercase text-[#ffdad5]/90">Sistem Informasi RT</span></div>
<!-- Center Logo & Core Message -->
<div class="relative z-10 my-auto py-10 flex flex-col items-center text-center max-w-md mx-auto">
<!-- Monogram Stylized Logo matching reference style -->
<div class="w-24 h-24 mb-6 relative flex items-center justify-center">
<svg class="w-full h-full text-white drop-shadow-md" fill="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<path d="M26 24L48 56V80" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"></path>
<path d="M46 54C54 44 76 43 76 60C76 74 62 82 48 80" stroke="white" stroke-linecap="round" stroke-width="11"></path>
</svg>
</div>
<h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-3">
          SiRT Digital
        </h1>
<p class="text-[#fefae6]/90 text-sm sm:text-base leading-relaxed max-w-xs sm:max-w-sm">Layanan administrasi dan kependudukan RT modern, cepat, serta terpercaya dalam satu sentuhan.</p>
<!-- Elegant horizontal divider with center dot -->
<div class="flex items-center justify-center gap-3 w-40 mt-8 opacity-60">
<div class="h-[1px] w-full bg-white/40"></div>
<div class="w-1.5 h-1.5 rounded-full bg-white flex-shrink-0"></div>
<div class="h-[1px] w-full bg-white/40"></div>
</div>
</div>
<!-- Bottom Feature Badges matching reference 3 columns -->
<div class="relative z-10 pt-6 border-t border-white/10 max-w-lg mx-auto w-full">
<div class="grid grid-cols-3 gap-4 text-center"><!-- Feature 1 -->
<div class="flex flex-col items-center space-y-2">
<div class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur-sm flex items-center justify-center text-white border border-white/10 shadow-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-medium text-[#fefae6]/90 tracking-wide">Modern &amp; Cepat</span>
</div>
<!-- Feature 2 -->
<div class="flex flex-col items-center space-y-2">
<div class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur-sm flex items-center justify-center text-white border border-white/10 shadow-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-medium text-[#fefae6]/90 tracking-wide">Akses Fleksibel</span>
</div>
<!-- Feature 3 -->
<div class="flex flex-col items-center space-y-2">
<div class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur-sm flex items-center justify-center text-white border border-white/10 shadow-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-medium text-[#fefae6]/90 tracking-wide">Aman Terlindungi</span>
</div></div>
</div>
</section>
<!-- END: LeftBrandShowcase -->
<!-- BEGIN: RightLoginArea -->
<section class="lg:w-1/2 flex items-center justify-center p-6 sm:p-10 lg:p-16 bg-[#f2eedb]">
<!-- Floating Card matching reference -->
<div class="w-full max-w-[420px] bg-white rounded-2xl shadow-xl shadow-stone-900/10 border border-[#e7e3d0] p-8 sm:p-10" data-purpose="login-card">
<!-- Card Header -->
<header class="text-center mb-8">
<h2 class="text-xl sm:text-2xl font-bold text-[#1d1c11] flex items-center justify-center gap-1.5">
            Selamat Datang Kembali <span class="text-amber-500"><br></span>
</h2>
<p class="text-xs sm:text-sm text-[#58413e] mt-1.5 font-normal">
            Masukkan kredensial Anda untuk melanjutkan
          </p>
</header>
<!-- Login Form -->
<form action="#" class="space-y-4" data-purpose="login-form" method="POST" onsubmit="event.preventDefault();">
<!-- Input: Email / NIK -->
<div>
<label class="block text-xs font-semibold text-[#1d1c11] mb-1.5" for="identifier">
              Email atau NIK
            </label>
<div class="relative rounded-lg shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<input class="block w-full pl-10 pr-3.5 py-2.5 text-xs sm:text-sm bg-white border border-[#dfbfbb] rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#6d0808] focus:border-[#6d0808] transition-colors" id="identifier" name="identifier" placeholder="nama@email.com / 3171..." required="" type="text">
</div>
</div>
<!-- Input: Password -->
<div>
<label class="block text-xs font-semibold text-[#1d1c11] mb-1.5" for="password">
              Password
            </label>
<div class="relative rounded-lg shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 text-xs sm:text-sm bg-white border border-[#dfbfbb] rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#6d0808] focus:border-[#6d0808] transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
<!-- Password Toggle Button -->
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-[#6d0808] focus:outline-none" id="togglePassword" type="button">
<svg class="h-4 w-4" fill="none" id="eyeIcon" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center cursor-pointer">
<input class="w-3.5 h-3.5 text-[#6d0808] border-[#dfbfbb] rounded focus:ring-[#6d0808] accent-[#6d0808]" name="remember" type="checkbox">
<span class="ml-2 text-xs text-[#58413e] select-none">Ingat saya</span>
</label>
<a class="text-xs font-semibold text-[#6d0808] hover:text-[#480002] hover:underline transition-colors" href="#">
              Lupa password?
            </a>
</div>
<!-- Primary Submit Button -->
<div class="pt-2">
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg font-semibold text-xs sm:text-sm text-white bg-[#6d0808] hover:bg-[#480002] active:bg-[#2d0000] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#6d0808] shadow-md shadow-[#6d0808]/25 transition-all duration-150 active:scale-[0.99]" type="submit">
              Masuk
            </button>
</div>
</form>
<!-- Divider with Text -->
<div class="relative my-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-[#e7e3d0]"></div>
</div>
<div class="relative flex justify-center text-xs">

</div>
</div>
<!-- Google SSO Button -->
<div data-purpose="social-login">

</div>
<!-- Footer Sign Up Prompt -->
<footer class="mt-6 text-center text-xs text-[#58413e]">
          Belum punya akun? 
          <a class="font-semibold text-[#6d0808] hover:text-[#480002] hover:underline transition-colors ml-1" href="#">
            Daftar sekarang
          </a>
</footer>
</div>
</section>
<!-- END: RightLoginArea -->
</main>
<!-- END: MainContainer -->
<!-- BEGIN: Simple Interaction Script -->
<script data-purpose="toggle-password-visibility">
    document.addEventListener('DOMContentLoaded', function () {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function () {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          
          // Toggle icon visual state slightly
          toggleBtn.classList.toggle('text-indigo-600', isPassword);
          toggleBtn.classList.toggle('text-slate-400', !isPassword);
        });
      }
    });
  </script>
<!-- END: Simple Interaction Script -->


</body></html>
